<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dosa Point order dashboard</title>
  <style>
    :root{
      --bg:#f8f2e8;
      --surface-1:#fff9f0;
      --surface-2:#ffffff;
      --border:#e7d8ba;
      --text:#2f2418;
      --text-secondary:#6e5f49;
      --text-muted:#9a8e72;
      --accent:#375b35;
      --accent-2:#b35d2b;
      --radius:12px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(180deg, #fbf6ea, #f3ead4);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
      padding:24px;
    }
    .panel{
      max-width:860px;
      margin:0 auto;
      background:var(--surface-1);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
      box-shadow:0 8px 26px rgba(88, 66, 21, 0.08);
    }
    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:1rem;
    }
    .topbar h3{margin:0; font-size:20px; color:var(--accent)}
    #count-badge{
      padding:5px 10px;
      border-radius:999px;
      background:var(--accent);
      color:#fff;
      font-size:12px;
      font-weight:700;
    }
    #menu-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
      gap:12px;
    }
    .item-card{
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:12px;
    }
    .item-name{
      font-weight:700;
      font-size:14px;
      margin:0 0 4px;
    }
    .item-price{
      margin:0 0 10px;
      font-size:13px;
      color:var(--text-secondary);
    }
    .qty-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .qty-btn{
      width:30px;
      height:30px;
      border-radius:50%;
      border:1px solid var(--accent);
      background:#fff;
      color:var(--accent);
      font-weight:700;
      cursor:pointer;
    }
    .qty-value{font-size:14px; font-weight:700}
    .order-box{
      margin-top:1.4rem;
      background:var(--surface-2);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:16px;
    }
    .order-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }
    .order-header span:first-child{color:var(--text-secondary); font-size:14px}
    #total{font-size:24px; font-weight:700; color:var(--accent-2)}
    #order-lines{margin-top:8px; color:var(--text-secondary); font-size:13px}
    .empty-note{margin:6px 0 0; color:var(--text-muted)}
  </style>
</head>
<body>
  <div class="panel">
    <h2 class="sr-only">Dosa Point order dashboard: add menu items and see your running total</h2>
    <div class="topbar">
      <h3>Dosa Point menu</h3>
      <div id="count-badge">0 items</div>
    </div>
    <div id="menu-grid"></div>

    <div class="order-box">
      <div class="order-header">
        <span>Your order</span>
        <span id="total">?0</span>
      </div>
      <div id="order-lines"></div>
    </div>
  </div>

  <script>
    const items = [
      {id:'plain', name:'Plain dosa', price:50},
      {id:'masala', name:'Masala dosa', price:70},
      {id:'mysore', name:'Mysore masala dosa', price:70},
      {id:'paneer', name:'Paneer dosa', price:100},
      {id:'cheese', name:'Cheese dosa', price:100},
      {id:'special', name:'Special dosa', price:150},
      {id:'vadapav', name:'Special vada pav', price:50},
      {id:'dahivada', name:'Special dahi vada (2 pcs)', price:50}
    ];
    const cart = {};

    function render(){
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = items.map(it => `
        <div class="item-card">
          <p class="item-name">${it.name}</p>
          <p class="item-price">?${it.price}</p>
          <div class="qty-row">
            <button class="qty-btn" aria-label="Remove ${it.name}" onclick="changeQty('${it.id}',-1)">-</button>
            <span class="qty-value">${cart[it.id] || 0}</span>
            <button class="qty-btn" aria-label="Add ${it.name}" onclick="changeQty('${it.id}',1)">+</button>
          </div>
        </div>
      `).join('');

      const activeItems = items.filter(it => cart[it.id] > 0);
      document.getElementById('count-badge').textContent = activeItems.reduce((sum, it) => sum + cart[it.id], 0) + ' items';
      const total = activeItems.reduce((sum, it) => sum + cart[it.id] * it.price, 0);
      document.getElementById('total').textContent = '?' + total.toLocaleString('en-IN');

      const lines = document.getElementById('order-lines');
      if(activeItems.length === 0){
        lines.innerHTML = '<p class="empty-note">Add items from the menu above.</p>';
      } else {
        lines.innerHTML = activeItems.map(it => `
          <div style="display:flex; justify-content:space-between; padding:4px 0;">
            <span>${it.name} × ${cart[it.id]}</span>
            <span>?${it.price * cart[it.id]}</span>
          </div>
        `).join('');
      }
    }

    function changeQty(id, delta){
      cart[id] = Math.max(0, (cart[id] || 0) + delta);
      render();
    }

    render();
  </script>
</body>
</html>
